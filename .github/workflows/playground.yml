name: playground
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Builds land on the gh-pages branch: production at the root, PR previews under
# pr-preview/<pr>/ (each PR keeps its own isolated URL).
concurrency:
  group: playground-${{ github.event_name == 'pull_request' && github.event.number || 'main' }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push builds to the gh-pages branch
      pull-requests: write # post/update the preview-link comment
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
      - run: pnpm build:playground
      - name: deploy production (site root)
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: playground/dist
          publish_branch: gh-pages
          keep_files: true # preserve pr-preview/ directories
          commit_message: 'deploy production ${{ github.sha }}'
      - name: deploy preview (pr-preview/<pr>/)
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        id: preview
        with:
          source-dir: playground/dist
          umbrella-dir: pr-preview
          preview-branch: gh-pages
      - name: post preview link
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            🔮 Playground preview for this PR: **${{ steps.preview.outputs.preview_url }}**

            Production: <https://cytusol.github.io/cytoid-notes-design/>
            The preview lives under `pr-preview/${{ github.event.number }}/` and updates with every push.

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write # remove the preview directory from gh-pages
    steps:
      - uses: actions/checkout@v4
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: playground/dist # unused for removal
          umbrella-dir: pr-preview
          preview-branch: gh-pages
          action: remove
