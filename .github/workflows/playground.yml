name: playground
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Builds deploy to Cloudflare Pages:
#   main  → production   https://cytoid-notes-design.pages.dev
#   PR    → preview      https://<branch>.cytoid-notes-design.pages.dev
# The deploy step is skipped (without failing) until the repo secrets
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are configured.
concurrency:
  group: playground-${{ github.event_name == 'pull_request' && github.event.number || 'main' }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # preview-link comment
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
      - run: pnpm build:playground
      - name: deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy playground/dist --project-name=cytoid-notes-design --branch=${{ github.event_name == 'pull_request' && github.head_ref || 'main' }} --commit-dirty=true
      - name: preview link comment
        if: github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            🔮 Preview (this branch): <https://${{ github.head_ref }}.cytoid-notes-design.pages.dev>
            🏠 Production: <https://cytoid-notes-design.pages.dev>
