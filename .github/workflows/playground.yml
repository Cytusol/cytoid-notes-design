name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Builds & previews deploy via Cloudflare Pages' Git integration
# (dashboard: Workers & Pages → cytoid-notes-design → Settings → Builds & deployments).
# Monorepo: leave "Root directory" empty (repo root) so pnpm resolves the
# workspace:* deps (playground imports @cytoid/notes + @cytoid/player);
# Build command `pnpm build:playground`, Build output directory `playground/dist`.
# This workflow is the test gate only; it does not deploy.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
      - run: pnpm build
      - run: pnpm build:playground
